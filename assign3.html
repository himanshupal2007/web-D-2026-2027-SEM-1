<!DOCTYPE html>
<html>
<head>
    <title>Block and Inline Elements</title>
</head>
<body>
    <!-- Block Elements -->
    <h1>Welcome to My Website</h1>
    <p>This is a paragraph.</p>
    <div>This is a block element.</div>
    <!-- Inline Elements -->
    <p>
        This is <b>bold</b> text.
        This is <i>italic</i> text.
        This is <span>inline</span> text.
    </p>
</body>
</html>
